name: Estadisticas

on:
  schedule:
    # 4 veces al día: estadísticas de partidos nuevos y números de jugadores (asistencias, minutos)
    - cron: '43 5,11,17,23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: estadisticas
  cancel-in-progress: false

jobs:
  estadisticas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar estadísticas
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: node scripts/estadisticas.mjs
      - name: Guardar cambios
        run: |
          git add public/data/estadisticas.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "pizarra-bot"
          git config user.email "pizarra-bot@users.noreply.github.com"
          git commit -m "Actualizar estadísticas"
          git pull --rebase origin main
          git push
