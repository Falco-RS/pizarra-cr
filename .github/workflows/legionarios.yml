name: Legionarios

on:
  schedule:
    # cada 2 horas (plan pagado): trae resultados de los partidos que terminaron y,
    # si el jugador jugó, sus números de temporada. Cada corrida gasta pocas consultas.
    - cron: '37 */2 * * *'
  workflow_dispatch:
    inputs:
      presupuesto:
        description: 'Máximo de consultas a la API en esta corrida'
        required: false
        default: '45'
      depurar:
        description: 'Escribir detalles de depuración (1 = sí)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: legionarios
  cancel-in-progress: false

jobs:
  legionarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar datos de los legionarios
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          # máximo de consultas por corrida (plan pagado; con el gratis, volver a correr 2 veces por semana)
          LEGIO_BUDGET: ${{ github.event.inputs.presupuesto || vars.LEGIO_BUDGET || '45' }}
          LEGIO_DEBUG: ${{ github.event.inputs.depurar }}
        run: node scripts/legionarios.mjs
      - name: Guardar cambios
        run: |
          git add public/data/legionarios.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "pizarra-bot"
          git config user.email "pizarra-bot@users.noreply.github.com"
          git commit -m "Actualizar legionarios"
          git pull --rebase origin main
          git push
