name: Legionarios

on:
  schedule:
    # dos veces por semana, lunes y jueves a las 5:47 a.m. de Costa Rica (11:47 UTC):
    # el lunes trae lo del fin de semana; el jueves, lo de media semana (copas europeas, MLS)
    - cron: '47 11 * * 1,4'
  workflow_dispatch:
    inputs:
      presupuesto:
        description: 'Máximo de consultas a la API en esta corrida'
        required: false
        default: '45'

permissions:
  contents: write

concurrency:
  group: legionarios
  cancel-in-progress: false

jobs:
  legionarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar datos de los legionarios
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          # máximo de consultas por corrida (plan gratis: 45 de las 100 diarias, dos días por semana)
          LEGIO_BUDGET: ${{ github.event.inputs.presupuesto || vars.LEGIO_BUDGET || '45' }}
        run: node scripts/legionarios.mjs
      - name: Guardar cambios
        run: |
          git add public/data/legionarios.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "pizarra-bot"
          git config user.email "pizarra-bot@users.noreply.github.com"
          git commit -m "Actualizar legionarios"
          git pull --rebase origin main
          git push
