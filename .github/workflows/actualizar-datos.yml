name: Actualizar datos

on:
  schedule:
    # cada 6 horas: 6:17 a.m., 12:17 p.m., 6:17 p.m. y 12:17 a.m. hora de Costa Rica
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar datos de Highlightly
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          # consultas extra por corrida para completar partidos (plan gratis: 6; plan pagado: 40)
          MAX_NEW_PER_RUN: ${{ vars.MAX_NEW_PER_RUN || '6' }}
        run: node scripts/update.mjs
      - name: Guardar cambios
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "pizarra-bot"
          git config user.email "pizarra-bot@users.noreply.github.com"
          git add public/data/season.json public/index.html public/sitemap.xml public/robots.txt
          git commit -m "Actualizar datos"
          git push
