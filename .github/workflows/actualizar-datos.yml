name: Actualizar datos

on:
  schedule:
    # cada hora; el script solo consulta la API si un partido terminó,
    # si faltan detalles por completar o si pasaron 6 horas desde la última actualización
    - cron: '17 * * * *'
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar datos de Highlightly
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          # consultas extra por corrida para completar partidos (plan pagado: 40; si se vuelve al gratis, poner la variable MAX_NEW_PER_RUN en 6)
          MAX_NEW_PER_RUN: ${{ vars.MAX_NEW_PER_RUN || '40' }}
          SMART: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: node scripts/update.mjs
      - name: Guardar cambios
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "pizarra-bot"
          git config user.email "pizarra-bot@users.noreply.github.com"
          git add public/data/season.json public/index.html public/sitemap.xml public/robots.txt
          git commit -m "Actualizar datos"
          git push
