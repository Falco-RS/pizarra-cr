<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cancha en vivo · prueba</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F2F4EF;--surface:#fff;--sunk:#E8ECE5;--line:#DCE1D8;--ink:#141A16;--muted:#55615A;--accent:#0E6B3D;--grass:#2E7D4F;--grass2:#2A7449;--chalk:#E9F2EC;--h:#C8102E;--a:#1F3B8A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1311;--surface:#161C19;--sunk:#1D2521;--line:#27312C;--ink:#E6EBE5;--muted:#9AA69F;--accent:#48C186;--grass:#1F6B44;--grass2:#1C623E;--chalk:#CFE3D6;--a:#4C78E0}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:15px;padding:16px;display:flex;justify-content:center}
.card{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.demo{background:var(--sunk);color:var(--muted);font-size:12.5px;padding:8px 14px;border-bottom:1px solid var(--line)}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px;gap:8px}
.tm{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed';font-weight:700;font-size:20px}.tm.a{justify-content:flex-end}
.tm img{width:32px;height:32px;object-fit:contain}
.sc{text-align:center}.sc b{font-family:'Barlow Condensed';font-weight:800;font-size:38px;line-height:1}
.sc span{display:block;font-size:12px;color:#D21034;font-weight:600}
.pitchwrap{position:relative;padding:0 14px}
svg{display:block;width:100%;height:auto;border-radius:10px}
#ball{transition:transform 1.1s cubic-bezier(.45,.05,.25,1)}
#zone{transition:opacity .5s, x .6s}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%) translateY(-6px);opacity:0;transition:.35s;background:rgba(10,14,12,.86);color:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.banner.on{opacity:1;transform:translateX(-50%) translateY(0)}
.banner i{width:10px;height:10px;border-radius:50%}
.banner.big{font-family:'Barlow Condensed';font-weight:800;font-size:28px;padding:6px 22px}
.sec{padding:12px 14px;border-top:1px solid var(--line)}
.lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}
.pos{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px}.pos i{transition:flex .8s}
.posn{display:flex;justify-content:space-between;font-weight:600;margin-top:4px;font-size:14px}
.mom{display:flex;align-items:center;gap:2px;height:56px;position:relative}
.mom:before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line)}
.mom i{flex:1;align-self:center;border-radius:2px;transition:height .5s}
.st{display:grid;grid-template-columns:40px 1fr 40px;row-gap:6px;font-size:14px}.st b{font-weight:600}.st span{text-align:center;color:var(--muted)}.st b:nth-child(3n){text-align:right}
.feed{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.feed li{display:flex;gap:10px;align-items:center;font-size:14px}.feed em{font-style:normal;color:var(--muted);width:30px;font-variant-numeric:tabular-nums}
.feed i{width:8px;height:8px;border-radius:50%;flex:none}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--bg);border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
</style></head><body>
<div class="card">
<div class="demo" id="demo">Prueba con datos de ejemplo. En el sitio leería las estadísticas en vivo de cada partido (se actualizan cada 30–60 s).</div>
<div class="hd"><div class="tm" id="th"><img src="https://highlightly.net/soccer/images/teams/700306.png" alt="">Alajuelense</div>
<div class="sc"><b id="score">0 - 0</b><span id="clock">23'</span></div>
<div class="tm a" id="ta">Cartaginés<img src="../escudos/cartagines.png" alt=""></div></div>
<div class="pitchwrap">
<svg viewBox="0 0 600 380" aria-label="Cancha en vivo">
 <defs><pattern id="g" width="100" height="380" patternUnits="userSpaceOnUse"><rect width="50" height="380" fill="var(--grass)"/><rect x="50" width="50" height="380" fill="var(--grass2)"/></pattern>
 <linearGradient id="zh" x1="0" x2="1"><stop offset="0" stop-color="var(--h)" stop-opacity="0"/><stop offset="1" stop-color="var(--h)" stop-opacity=".45"/></linearGradient>
 <linearGradient id="za" x1="1" x2="0"><stop offset="0" stop-color="var(--a)" stop-opacity="0"/><stop offset="1" stop-color="var(--a)" stop-opacity=".45"/></linearGradient></defs>
 <rect width="600" height="380" fill="url(#g)"/>
 <rect id="zone" x="400" y="0" width="200" height="380" fill="url(#zh)" opacity="0"/>
 <g fill="none" stroke="var(--chalk)" stroke-width="2" opacity=".8">
  <rect x="10" y="10" width="580" height="360"/><line x1="300" y1="10" x2="300" y2="370"/><circle cx="300" cy="190" r="48"/>
  <rect x="10" y="98" width="86" height="184"/><rect x="504" y="98" width="86" height="184"/>
  <rect x="10" y="150" width="30" height="80"/><rect x="560" y="150" width="30" height="80"/>
  <rect x="2" y="166" width="8" height="48"/><rect x="590" y="166" width="8" height="48"/></g>
 <g id="ball" style="transform:translate(300px,190px)"><circle r="12" fill="#fff" opacity=".25"/><circle r="7" fill="#fff" stroke="#141A16" stroke-width="1.5"/></g>
</svg>
<div class="banner" id="banner"></div>
</div>
<div class="sec"><div class="lab"><span>Posesión</span></div>
 <div class="pos"><i id="ph" style="flex:54;background:var(--h)"></i><i id="pa" style="flex:46;background:var(--a)"></i></div>
 <div class="posn"><span id="phn">54%</span><span id="pan">46%</span></div></div>
<div class="sec"><div class="lab"><span>Quién ataca más</span><span>arriba LDA · abajo CAR</span></div><div class="mom" id="mom"></div></div>
<div class="sec"><div class="lab"><span>Estadísticas</span></div><div class="st" id="st"></div></div>
<div class="sec"><div class="lab"><span>Jugadas</span><button id="re">Repetir</button></div><ul class="feed" id="feed"></ul></div>
</div>
<script>
// Instantáneas como las que devuelve /api/live (una cada ~minuto). La prueba las recorre más rápido.
const K=['Attacks','Shots on target','Shots off target','Corners','Free Kicks','Goal Kicks','Throw-Ins','Offsides','Yellow cards','Possession'];
const base={h:{Attacks:28,'Shots on target':1,'Shots off target':0,Corners:0,'Free Kicks':5,'Goal Kicks':1,'Throw-Ins':5,Offsides:0,'Yellow cards':0,Possession:.54},
            a:{Attacks:25,'Shots on target':2,'Shots off target':1,Corners:0,'Free Kicks':2,'Goal Kicks':3,'Throw-Ins':5,Offsides:0,'Yellow cards':0,Possession:.46}};
const steps=[ // cambios minuto a minuto (ejemplo)
 [24,{h:{Attacks:2,'Throw-Ins':1}}],[25,{h:{Attacks:2,'Shots off target':1},a:{'Goal Kicks':1}}],
 [26,{a:{Attacks:2,'Free Kicks':1}}],[27,{a:{Attacks:3,Corners:1}}],[28,{a:{Attacks:1,'Shots on target':1}}],
 [29,{h:{Attacks:2},a:{Offsides:1}}],[30,{h:{Attacks:3,Corners:1}}],[31,{h:{'Shots on target':1},goal:'h'}],
 [32,{a:{Attacks:2,'Yellow cards':1},h:{'Free Kicks':1}}],[33,{h:{Attacks:1,'Throw-Ins':1}}],[34,{a:{Attacks:3,'Shots off target':1},h:{'Goal Kicks':1}}],
 [35,{a:{Attacks:2,Corners:1}}],[36,{h:{Attacks:2,'Free Kicks':1}}]];
const N={h:'Alajuelense',a:'Cartaginés'}, C={h:'var(--h)',a:'var(--a)'};
let cur, score, mom, q=[], busy=false, timer;
const $=id=>document.getElementById(id);
function reset(){if(qs.has('vivo'))return;cur=JSON.parse(JSON.stringify(base));score={h:0,a:0};mom=[2,-1,1,3,-2,1,2,-1,-2,1];$('feed').innerHTML='';$('score').textContent='0 - 0';$('clock').textContent="23'";drawStats();drawMom();}
function drawStats(){const L=[['Remates a puerta','Shots on target'],['Remates afuera','Shots off target'],['Córners','Corners'],['Ataques','Attacks'],['Amarillas','Yellow cards']];
 $('st').innerHTML=L.map(([l,k])=>`<b>${cur.h[k]}</b><span>${l}</span><b>${cur.a[k]}</b>`).join('');
 const p=Math.round(cur.h.Possession*100);$('ph').style.flex=p;$('pa').style.flex=100-p;$('phn').textContent=p+'%';$('pan').textContent=(100-p)+'%';}
function drawMom(){$('mom').innerHTML=mom.map(v=>`<i style="height:${Math.min(100,Math.abs(v)*16)}%;background:${v>=0?C.h:C.a};transform:translateY(${v>=0?'-50%':'50%'})"></i>`).join('');}
// h ataca hacia la derecha (x grande), a hacia la izquierda
const X=(s,x)=>s==='h'?x:600-x, R=(a,b)=>a+Math.random()*(b-a);
const ACT={
 'Attacks':s=>({x:X(s,R(400,520)),y:R(90,290),txt:'Ataque de '+N[s],zone:s,quiet:true}),
 'Shots on target':s=>({x:X(s,585),y:R(172,208),txt:'Remate al arco · '+N[s],zone:s}),
 'Shots off target':s=>({x:X(s,596),y:Math.random()<.5?R(120,160):R(220,260),txt:'Remate desviado · '+N[s],zone:s}),
 'Corners':s=>{const y=Math.random()<.5?14:366;return{x:X(s,586),y,txt:'Córner para '+N[s],zone:s}},
 'Free Kicks':s=>({x:X(s,R(330,450)),y:R(80,300),txt:'Tiro libre para '+N[s],quiet:true}),
 'Goal Kicks':s=>({x:X(s,60),y:190,txt:'Saque de meta · '+N[s],quiet:true}),
 'Throw-Ins':s=>({x:X(s,R(200,450)),y:Math.random()<.5?12:368,txt:'Saque de banda · '+N[s],quiet:true}),
 'Offsides':s=>({x:X(s,R(450,520)),y:R(100,280),txt:'Fuera de juego · '+N[s]}),
 'Yellow cards':s=>({x:R(220,380),y:R(120,260),txt:'🟨 Amarilla para '+N[s]}),
};
function enqueue(min,ch){
 for(const s of ['h','a']) for(const k in (ch[s]||{})){
  const n=ch[s][k]; cur[s][k]+=n;
  if(k==='Attacks'){mom.push(s==='h'?n:-n);if(mom.length>18)mom.shift();}
  // varios ataques en el mismo minuto se muestran como uno solo
  for(let i=0;i<(k==='Attacks'?1:n);i++)q.push({min,s,k});
 }
 if(ch.goal){score[ch.goal]++;q.push({min,s:ch.goal,k:'goal'});}
 const sh=(ch.h?.Attacks||0)-(ch.a?.Attacks||0);cur.h.Possession=Math.min(.68,Math.max(.32,cur.h.Possession+sh*.004));cur.a.Possession=1-cur.h.Possession;
}
function show(txt,s,big){const b=$('banner');b.className='banner on'+(big?' big':'');b.innerHTML=(big?'':`<i style="background:${C[s]}"></i>`)+txt;}
function feed(min,s,txt){const li=document.createElement('li');li.innerHTML=`<em>${min}'</em><i style="background:${C[s]}"></i>${txt}`;$('feed').prepend(li);}
function play(){
 if(busy||!q.length)return; busy=true;
 const e=q.shift(); let a;
 if(e.k==='goal'){a={x:X(e.s,598),y:190};show('⚽ ¡GOL DE '+N[e.s].toUpperCase()+'!',e.s,true);$('score').textContent=score.h+' - '+score.a;feed(e.min,e.s,'<b>Gol de '+N[e.s]+'</b>');}
 else{a=ACT[e.k](e.s);show(a.txt,e.s);if(!a.quiet)feed(e.min,e.s,a.txt);}
 $('ball').style.transform=`translate(${a.x}px,${a.y}px)`;
 const z=$('zone'); if(a.zone||e.k==='goal'){const s=a.zone||e.s;z.setAttribute('x',s==='h'?400:0);z.setAttribute('fill',s==='h'?'url(#zh)':'url(#za)');z.setAttribute('opacity',1);} else z.setAttribute('opacity',0);
 $('clock').textContent=e.min+"'"; drawStats(); drawMom();
 setTimeout(()=>{busy=false;$('banner').classList.remove('on');play();}, e.k==='goal'?2600:a.quiet?1300:1900);
}
function run(){clearInterval(timer);q=[];busy=false;reset();let i=0;
 const tick=()=>{if(i>=steps.length){clearInterval(timer);return;}const [m,c]=steps[i++];enqueue(m,c);play();};
 tick();timer=setInterval(tick,3800);}
$('re').onclick=run;
// --- Modo en vivo: ?vivo (el primer partido en juego) o ?vivo=<id>
const qs=new URLSearchParams(location.search);
if(!qs.has('vivo')) run(); else {
 $('re').style.display='none'; $('feed').innerHTML='<li><em></em>Esperando la próxima actualización…</li>';
 const want=qs.get('vivo'); let last=null, first=true;
 const lg=t=>t.logo?`<img src="${t.logo}" alt="">`:'';
 async function poll(){
  try{
   const d=await (await fetch('/api/live',{cache:'no-store'})).json();
   const m=(d.live||[]).find(x=>want?String(x.id)===want:(x.started&&!x.finished))||(d.live||[]).find(x=>String(x.id)===want);
   if(!m){$('demo').textContent='No hay ningún partido en vivo en este momento.';return;}
   $('demo').textContent=`En vivo · ${m.comp} · datos de la API, se actualizan cada ~60 s`+(m.finished?' · Final':'');
   N.h=m.h.name;N.a=m.a.name;$('th').innerHTML=lg(m.h)+m.h.name;$('ta').innerHTML=m.a.name+lg(m.a);
   const st={h:{},a:{}};(m.stats||[]).forEach((t,i)=>{st[i?'a':'h']=t.s;});
   for(const s of ['h','a'])for(const k of K)st[s][k]=Number(st[s][k]??0);
   const [gh,ga]=String(m.score||'0 - 0').split('-').map(x=>parseInt(x)||0);
   const min=m.clock||0;
   if(first){cur=st;score={h:gh,a:ga};mom=[];first=false;}
   else{
    const ph=$('feed').querySelector('li em:empty');if(ph)ph.parentNode.remove();
    const ch={h:{},a:{}};
    for(const s of ['h','a'])for(const k of K)if(k!=='Possession'){const dlt=st[s][k]-(last.st[s][k]||0);if(dlt>0)ch[s][k]=dlt;}
    enqueue(min,ch); for(const s of ['h','a'])cur[s].Possession=st[s].Possession;
    if(gh>last.gh)q.push({min,s:'h',k:'goal'}); if(ga>last.ga)q.push({min,s:'a',k:'goal'});
    score={h:gh,a:ga}; play();
   }
   last={st:JSON.parse(JSON.stringify(st)),gh,ga};
   $('score').textContent=gh+' - '+ga;$('clock').textContent=m.finished?'Final':min+"'";drawStats();drawMom();
  }catch(e){$('demo').textContent='No se pudo leer el en vivo; reintento en 30 s.';}
 }
 poll(); setInterval(poll,30000);
}
</script></body></html>
