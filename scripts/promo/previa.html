<style>
.wrap{padding:52px 52px 0}
.hd{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:26px;font-family:'Barlow Condensed';font-weight:800;font-size:56px;text-transform:uppercase}
.hd img{width:72px;height:72px;object-fit:contain}.hd em{font-style:normal;color:#6F7C75;font-size:36px}
.sub{text-align:center;font-size:21px;color:#B9C4BD;margin-top:6px}
.grid{display:grid;grid-template-columns:430px 1fr;gap:26px;margin-top:22px}
.lab{font-family:'Barlow Condensed';font-weight:700;font-size:20px;letter-spacing:2px;color:#9DAAA2;text-transform:uppercase;margin:0 0 8px}
.fb{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:19px;margin:6px 2px}
.fb b{font-family:'Barlow Condensed';font-size:28px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
.dh{background:__HC__}.da{background:__AC__}
.pitch{position:relative;height:720px;border-radius:16px;background:repeating-linear-gradient(#1f6b43 0 60px,#22744a 60px 120px);overflow:hidden}
.ln{position:absolute;border:2px solid rgba(255,255,255,.55)}
.out{inset:12px}.mid{left:12px;right:12px;top:50%;height:0;border-width:2px 0 0}
.circ{left:50%;top:50%;width:110px;height:110px;border-radius:50%;transform:translate(-50%,-50%)}
.b1{left:24%;right:24%;top:12px;height:80px;border-top:0}.b2{left:24%;right:24%;bottom:12px;height:80px;border-bottom:0}
.pl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:22%}
.pl b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:800;font-size:20px}
.pl span{margin-top:3px;font-size:15px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
.h b{background:__HC__;color:__HT__}.a b{background:__AC__;color:__AT__}
.dts{margin-top:10px;font-size:17px;color:#B9C4BD;display:flex;flex-direction:column;gap:4px}
.card{background:#1B2420;border:2px solid #26302B;border-radius:14px;padding:16px 18px;margin-bottom:14px}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:18px}
.cap .t{font-weight:700;margin-bottom:6px}
.chip{display:inline-block;background:#F0BE1E;color:#141A16;font-weight:700;font-size:14px;border-radius:5px;padding:2px 8px;margin-right:6px}
.mute{color:#9DAAA2}
table{width:100%;border-collapse:collapse;font-size:18px}
td{padding:7px 4px;border-top:1px solid #26302B;text-align:center}
td:nth-child(2){color:#9DAAA2;font-size:16px}
tr:first-child td{border-top:0;font-family:'Barlow Condensed';font-weight:800;font-size:22px;color:#EEF2EC}
td b{font-family:'Barlow Condensed';font-size:24px}
.l5{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.l5 .t{font-weight:700;font-size:18px;margin-bottom:8px}
.pills{display:flex;gap:6px}
.pills span{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:800;font-size:22px}
.G{background:#48C186;color:#06130C}.E{background:#7E8983;color:#fff}.P{background:#FF5A6E;color:#2A0006}
.foot{padding:18px 0 28px;margin-top:14px}
</style>

<script>
const D=__DATA__;
const p=document.getElementById('p');
const place=(L,side,top)=>{const rows=L.rows;rows.forEach((row,i)=>{const t=rows.length===1?.5:i/(rows.length-1);const y=top?7+t*37:93-t*37;
 row.forEach((pl,j)=>{const d=document.createElement('div');d.className='pl '+side;d.style.left=((j+1)/(row.length+1)*100)+'%';d.style.top=y+'%';
 const nm=pl.name.split(' ').slice(-1)[0];d.innerHTML='<b>'+pl.n+'</b><span>'+nm+(pl.c?' (C)':'')+'</span>';p.appendChild(d);});});};
place(D.home,'h',true);place(D.away,'a',false);
</script>
